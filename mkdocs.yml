site_name: Kismet for Mere Mortals
site_description: A wireless network monitor that only listens and never transmits. How it builds a census of access points and clients from the frames they broadcast, how to learn it safely on replayed capture files, and how to read what it finds through the web interface, the API and the run log, with the law and the limits stated plainly.
site_url: https://paulsullivan33-dev.github.io/kismet-for-mere-mortals/
copyright: 'Part of <a href="https://paulsullivan33-dev.github.io/mere-mortals/">For Mere Mortals</a> · Text CC BY 4.0, code MIT'

